<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
    <meta charset="{{ site.encoding | default: 'utf-8' }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}
    {% feed_meta %}
    {% json_feed_meta %}
  </head>
  <body>
    <nav class="a11y-only">
      <h2>{{ site.a11y_labels.nav | default: "Jump to:" }}</h2>

      {%- if site.menu %}
        <a href="#menu">
          {{- site.menu.title -}}
        </a>
      {% endif -%}

      <a href="#content">
        {{- site.a11y_labels.content | default: "Site content" -}}
      </a>
    </nav>

    <div id="page">
      {% include header.html %}

      <main id="content" class="site-content">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>
  </body>
</html>
