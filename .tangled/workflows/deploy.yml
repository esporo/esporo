when:
  - event: ["push"]
    branch: ["main"]

engine: "nixery"

clone:
  depth: 1

dependencies:
  nixpkgs:
    - ruby_3_3
    - bundler
    - nodejs_22
    - gcc
    - gnumake
    - openssl
    - pkg-config

steps:
  - name: "Install gems"
    command: "bundle install"

  - name: "Build site"
    command: "bundle exec jekyll build"

  - name: "Deploy to Cloudflare Pages"
    command: "npx wrangler pages deploy _site --project-name=esporonet --branch=main"
